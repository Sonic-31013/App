<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reel Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b11;
    --surface: #0f1620;
    --surface-2: #16202c;
    --blue: #4a90e2;
    --blue-dim: rgba(74, 144, 226, 0.28);
    --blue-deep: #1b3a5c;
    --text: #e7edf3;
    --text-dim: #7b8ca0;
    --radius: 10px;
    --display: 'Bebas Neue', 'Arial Narrow', sans-serif;
    --body: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 680px; margin: 0 auto; padding: 0 20px 64px; }

  /* --- Header --- */
  .marquee { text-align: center; padding: 30px 0 20px; }

  .sprockets {
    height: 10px;
    background-image: radial-gradient(circle at 5px 5px, var(--bg) 2.8px, var(--blue) 3.1px);
    background-size: 18px 10px;
    background-repeat: repeat-x;
    opacity: 0.7;
    margin-top: 10px;
  }

  .marquee h1 {
    font-family: var(--display);
    font-size: clamp(2.4rem, 7vw, 3.2rem);
    letter-spacing: 0.08em;
    color: var(--blue);
    margin: 0;
  }

  .marquee .tagline {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    margin: 6px 0 0;
  }

  /* --- Banners / status --- */
  .banner {
    border: 1px solid var(--blue-dim);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .banner strong { color: var(--blue); }

  .status { font-family: var(--mono); font-size: 0.8rem; color: var(--text-dim); min-height: 1.2em; margin-top: 8px; }
  .status--error { color: #e08a8a; }

  /* --- Search card --- */
  .search-card { background: var(--surface); border: 1px solid var(--blue-dim); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }

  .search-card label { display: block; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 8px; }

  .search-row { display: flex; gap: 10px; }

  #search-input {
    flex: 1; background: var(--bg); border: 1px solid var(--blue-dim); border-radius: 8px;
    color: var(--text); font-family: var(--body); font-size: 1rem; padding: 12px 14px; min-height: 44px;
  }
  #search-input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  button {
    font-family: var(--mono); font-size: 0.83rem; letter-spacing: 0.02em; cursor: pointer;
    border-radius: 8px; min-height: 44px; border: 1px solid transparent;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }

  .btn-primary { background: var(--blue); color: #061019; font-weight: 600; padding: 0 20px; }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--blue-dim); padding: 0 16px; }
  .btn-ghost:hover { color: var(--blue); border-color: var(--blue); }

  /* --- Picker --- */
  .picker { margin-bottom: 20px; }
  .picker h2, .confirm-card h2, .log-section h2 {
    font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim); margin: 0 0 10px;
  }

  .picker-list { display: flex; flex-direction: column; gap: 6px; }

  .picker-item {
    background: var(--surface); border: 1px solid var(--blue-dim); border-radius: var(--radius);
    padding: 12px 14px; width: 100%; text-align: left; color: var(--text); font-family: var(--body);
  }
  .picker-item:hover { border-color: var(--blue); background: var(--surface-2); }
  .picker-item .year { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); }

  /* --- Confirm card --- */
  .confirm-card { background: var(--surface); border: 1px solid var(--blue-dim); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }

  .confirm-title { font-family: var(--display); font-size: 1.9rem; letter-spacing: 0.02em; color: var(--blue); line-height: 1.1; }
  .confirm-title .year { font-family: var(--mono); font-size: 1rem; color: var(--text-dim); letter-spacing: 0; margin-left: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 16px; }
  .chip { font-family: var(--mono); font-size: 0.72rem; border: 1px solid var(--blue-dim); color: var(--blue); border-radius: 999px; padding: 3px 10px; }
  .chip.small { font-size: 0.68rem; padding: 2px 8px; }

  .detail-list { margin: 0 0 6px; }
  .detail-row { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--blue-dim); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row dt { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); width: 84px; flex-shrink: 0; margin: 0; }
  .detail-row dd { margin: 0; font-size: 0.94rem; }

  .not-this { background: none; border: none; color: var(--text-dim); font-family: var(--mono); font-size: 0.76rem; text-decoration: underline; padding: 10px 0 4px; min-height: unset; }
  .not-this:hover { color: var(--blue); }

  hr.tear { border: none; border-top: 1px dashed var(--blue-dim); margin: 16px 0; }

  .field-label { display: block; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 8px; }

  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--blue-dim); border-radius: 8px;
    color: var(--text); font-family: var(--body); font-size: 0.95rem; padding: 12px 14px;
    min-height: 90px; resize: vertical; margin-bottom: 16px;
  }
  textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* --- Log --- */
  .log-section { margin-top: 32px; }
  .log-list { display: flex; flex-direction: column; gap: 10px; }

  .log-card { background: var(--surface); border: 1px solid var(--blue-dim); border-radius: var(--radius); padding: 16px; }
  .log-title { font-family: var(--display); font-size: 1.3rem; color: var(--blue); letter-spacing: 0.02em; }
  .log-title .year { font-family: var(--mono); font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0; margin-left: 6px; }

  .log-detail { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim); margin: 3px 0; }
  .log-detail strong { color: var(--text); font-weight: 500; }

  .log-comment { font-size: 0.9rem; color: var(--text); margin: 10px 0 0; padding-top: 10px; border-top: 1px dashed var(--blue-dim); }
  .log-comment:empty { display: none; }
  .log-date { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); margin-top: 8px; }

  .empty-state { font-family: var(--mono); font-size: 0.85rem; color: var(--text-dim); border: 1px dashed var(--blue-dim); border-radius: var(--radius); padding: 24px; text-align: center; }

  footer { margin-top: 40px; text-align: center; font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim); }
  footer a { color: var(--blue); }

  @media (max-width: 480px) {
    .search-row { flex-direction: column; }
    .btn-primary { width: 100%; }
    .detail-row { flex-direction: column; gap: 2px; }
    .detail-row dt { width: auto; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="marquee">
    <h1>Reel Notes</h1>
    <p class="tagline">look it up · confirm it · log it</p>
    <div class="sprockets"></div>
  </header>

  <div id="config-banner" class="banner" hidden></div>

  <main>
    <section class="search-card" id="search-card">
      <label for="search-input">Movie title</label>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="e.g. Interstellar" autocomplete="off" />
        <button id="search-btn" class="btn-primary">Look it up</button>
      </div>
      <div id="search-status" class="status" aria-live="polite"></div>
    </section>

    <section id="picker" class="picker" hidden>
      <h2>Which one did you mean?</h2>
      <div id="picker-list" class="picker-list"></div>
    </section>

    <section id="confirm" class="confirm-card" hidden></section>

    <section class="log-section">
      <h2>Your log</h2>
      <div id="log-status" class="status" aria-live="polite"></div>
      <div id="log-list" class="log-list"></div>
    </section>
  </main>

  <footer>
    <p>Movie data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDb</a>. This product uses the TMDb API but is not endorsed or certified by TMDb.<br>Entries are stored in your own Supabase project.</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================================
  // CONFIG — fill these in before deploying. See README.md.
  // ============================================================
  const TMDB_API_KEY   = 'YOUR_TMDB_API_KEY';        // themoviedb.org/settings/api
  const SUPABASE_URL   = 'YOUR_SUPABASE_PROJECT_URL'; // e.g. https://xxxx.supabase.co
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Project Settings > API > anon public key
  const TABLE_NAME = 'entries';
  // ============================================================

  const isConfigured = !TMDB_API_KEY.startsWith('YOUR_') &&
                        !SUPABASE_URL.startsWith('YOUR_') &&
                        !SUPABASE_ANON_KEY.startsWith('YOUR_');

  const supabase = isConfigured
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  const configBanner = document.getElementById('config-banner');
  const searchInput = document.getElementById('search-input');
  const searchBtn = document.getElementById('search-btn');
  const searchStatus = document.getElementById('search-status');
  const picker = document.getElementById('picker');
  const pickerList = document.getElementById('picker-list');
  const confirmSection = document.getElementById('confirm');
  const logStatus = document.getElementById('log-status');
  const logList = document.getElementById('log-list');

  if (!isConfigured) {
    configBanner.hidden = false;
    configBanner.innerHTML = '<strong>Setup needed.</strong> Open index.html and add your TMDb API key and Supabase project URL/anon key at the top of the &lt;script&gt; section. See README.md.';
    searchBtn.disabled = true;
  } else {
    loadLog();
  }

  searchBtn.addEventListener('click', handleSearch);
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });

  async function handleSearch() {
    const query = searchInput.value.trim();
    if (!query) { searchStatus.textContent = 'Type a movie title first.'; return; }

    resetConfirm();
    picker.hidden = true;
    searchStatus.textContent = 'Searching…';
    searchStatus.classList.remove('status--error');

    try {
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error(`TMDb returned ${res.status}`);
      const data = await res.json();
      const results = (data.results || []).slice(0, 5);

      if (results.length === 0) {
        searchStatus.textContent = `No matches for "${query}". Check the spelling and try again.`;
        return;
      }

      searchStatus.textContent = '';
      renderPicker(results);
    } catch (err) {
      searchStatus.textContent = "Couldn't reach TMDb — check your API key in the config section.";
      searchStatus.classList.add('status--error');
      console.error(err);
    }
  }

  function renderPicker(results) {
    pickerList.innerHTML = '';
    results.forEach((movie) => {
      const item = document.createElement('button');
      item.className = 'picker-item';
      const year = movie.release_date ? movie.release_date.slice(0, 4) : 'Unknown year';
      item.innerHTML = `${escapeHtml(movie.title)} <span class="year">(${year})</span>`;
      item.addEventListener('click', () => selectMovie(movie.id));
      pickerList.appendChild(item);
    });
    picker.hidden = false;
  }

  async function selectMovie(id) {
    picker.hidden = true;
    searchStatus.textContent = 'Loading details…';

    try {
      const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits`);
      if (!res.ok) throw new Error(`TMDb returned ${res.status}`);
      const movie = await res.json();
      searchStatus.textContent = '';
      renderConfirm(movie);
    } catch (err) {
      searchStatus.textContent = "Couldn't load that movie's details. Try again.";
      searchStatus.classList.add('status--error');
      console.error(err);
    }
  }

  function formatRuntime(minutes) {
    if (!minutes) return '—';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function getDirectors(movie) {
    const crew = (movie.credits && movie.credits.crew) || [];
    return crew.filter(c => c.job === 'Director').map(c => c.name);
  }

  function getActors(movie, limit) {
    const cast = (movie.credits && movie.credits.cast) || [];
    return cast.slice(0, limit).map(c => c.name);
  }

  function renderConfirm(movie) {
    const year = movie.release_date ? movie.release_date.slice(0, 4) : '—';
    const genres = (movie.genres || []).map(g => g.name);
    const directors = getDirectors(movie);
    const actors = getActors(movie, 5);
    const rating = movie.vote_average ? movie.vote_average.toFixed(1) + '/10' : '—';
    const runtime = formatRuntime(movie.runtime);

    confirmSection.innerHTML = `
      <h2>Confirm</h2>
      <div class="confirm-title">${escapeHtml(movie.title)}<span class="year">${year}</span></div>
      <div class="chips">${genres.map(g => `<span class="chip">${escapeHtml(g)}</span>`).join('') || '<span class="chip">Genre unknown</span>'}</div>
      <dl class="detail-list">
        <div class="detail-row"><dt>Rating</dt><dd>${rating}</dd></div>
        <div class="detail-row"><dt>Runtime</dt><dd>${runtime}</dd></div>
        <div class="detail-row"><dt>Director</dt><dd>${escapeHtml(directors.join(', ') || '—')}</dd></div>
        <div class="detail-row"><dt>Actors</dt><dd>${escapeHtml(actors.join(', ') || '—')}</dd></div>
      </dl>
      <button class="not-this" id="not-this-btn">Not this one — search again</button>
      <hr class="tear" />
      <span class="field-label">Your comments</span>
      <textarea id="comment" placeholder="Anything you want to remember about this one…"></textarea>
      <button class="btn-primary" id="save-btn">Save to my log</button>
      <div class="status" id="save-status" aria-live="polite"></div>
    `;
    confirmSection.hidden = false;

    document.getElementById('not-this-btn').addEventListener('click', () => {
      resetConfirm();
      picker.hidden = false;
    });

    document.getElementById('save-btn').addEventListener('click', () => saveEntry(movie, genres, directors, actors, rating, runtime));
  }

  function resetConfirm() {
    confirmSection.hidden = true;
    confirmSection.innerHTML = '';
  }

  async function saveEntry(movie, genres, directors, actors, ratingText, runtimeText) {
    const saveBtn = document.getElementById('save-btn');
    const saveStatus = document.getElementById('save-status');
    const comment = document.getElementById('comment').value.trim();

    saveBtn.disabled = true;
    saveStatus.textContent = 'Saving…';
    saveStatus.classList.remove('status--error');

    const row = {
      query_text: searchInput.value.trim(),
      tmdb_id: movie.id,
      matched_title: movie.title,
      release_year: movie.release_date ? movie.release_date.slice(0, 4) : null,
      genres: genres,
      rating: movie.vote_average || null,
      directors: directors,
      actors: actors,
      runtime_minutes: movie.runtime || null,
      comment: comment || null,
    };

    try {
      const { data, error } = await supabase.from(TABLE_NAME).insert(row).select().single();
      if (error) throw error;

      saveStatus.textContent = 'Saved.';
      prependToLog(data);
      searchInput.value = '';
      setTimeout(() => { resetConfirm(); searchStatus.textContent = ''; }, 600);
    } catch (err) {
      saveStatus.textContent = "Couldn't save — check your Supabase URL/key and that the table matches README.md.";
      saveStatus.classList.add('status--error');
      saveBtn.disabled = false;
      console.error(err);
    }
  }

  async function loadLog() {
    logStatus.textContent = 'Loading your log…';
    try {
      const { data, error } = await supabase
        .from(TABLE_NAME)
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;

      logStatus.textContent = '';
      renderLog(data || []);
    } catch (err) {
      logStatus.textContent = "Couldn't load your log — check your Supabase config and that the table matches README.md.";
      logStatus.classList.add('status--error');
      console.error(err);
    }
  }

  function renderLog(entries) {
    if (entries.length === 0) {
      logList.innerHTML = '<div class="empty-state">Your log is empty. Search for a movie above to add your first entry.</div>';
      return;
    }
    logList.innerHTML = '';
    entries.forEach(addLogCard);
  }

  function prependToLog(entry) {
    const empty = logList.querySelector('.empty-state');
    if (empty) empty.remove();
    addLogCard(entry, true);
  }

  function addLogCard(entry, prepend) {
    const card = document.createElement('div');
    card.className = 'log-card';
    const date = entry.created_at ? new Date(entry.created_at).toLocaleDateString() : '';
    const genres = entry.genres || [];
    const rating = entry.rating ? Number(entry.rating).toFixed(1) + '/10' : '—';
    const runtime = formatRuntime(entry.runtime_minutes);
    const directors = (entry.directors || []).join(', ') || '—';
    const actors = (entry.actors || []).join(', ') || '—';

    card.innerHTML = `
      <div class="log-title">${escapeHtml(entry.matched_title || entry.query_text)}<span class="year">${entry.release_year || ''}</span></div>
      <div class="chips">${genres.map(g => `<span class="chip small">${escapeHtml(g)}</span>`).join('')}</div>
      <div class="log-detail"><strong>Rating</strong> ${rating} &nbsp;·&nbsp; <strong>Runtime</strong> ${runtime}</div>
      <div class="log-detail"><strong>Director</strong> ${escapeHtml(directors)}</div>
      <div class="log-detail"><strong>Actors</strong> ${escapeHtml(actors)}</div>
      <p class="log-comment">${escapeHtml(entry.comment || '')}</p>
      <div class="log-date">${date ? 'Logged ' + date : ''}</div>
    `;
    if (prepend) logList.prepend(card); else logList.appendChild(card);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
</script>
</body>
</html>
